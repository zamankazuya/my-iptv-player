<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Coolwalk IPTV — Native ExoPlayer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { background: transparent !important; color: #f5f5f7; overflow: hidden; height: 100dvh; width: 100vw; margin: 0; font-family: system-ui, sans-serif; }
    .glass { background: rgba(18, 19, 26, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); transition: opacity 0.25s ease, transform 0.25s ease; }
    .glass-active { background: rgba(14, 165, 233, 0.35); border-color: #38bdf8 !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .ui-hidden { opacity: 0 !important; pointer-events: none !important; }
    .radio-dot { width: 18px; height: 18px; border-radius: 9999px; border: 2px solid rgba(255,255,255,0.45); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .radio-dot-active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.2); }
    .radio-dot-active::after { content: ''; width: 8px; height: 8px; border-radius: 9999px; background: #38bdf8; }
  </style>
</head>
<body class="flex flex-col h-full w-full p-2.5 gap-2 bg-transparent relative">

  <!-- FULLSCREEN WAKE SHIELD: Absorbs the first touch when fullscreen so boxes appear safely before any button can be clicked -->
  <div id="wakeShield" class="hidden fixed inset-0 z-40 bg-transparent cursor-pointer"></div>

  <!-- MAIN VIDEO OVERLAY AREA -->
  <main class="relative flex-1 w-full overflow-hidden border-0 outline-none">
    <section id="videoOverlayContainer" class="relative w-full h-full overflow-hidden bg-transparent border-0 outline-none flex items-center justify-center cursor-pointer">
      
      <!-- Buffering Spinner -->
      <div id="loading" class="hidden absolute inset-0 bg-black/40 backdrop-blur-xs flex flex-col items-center justify-center z-10 pointer-events-none">
        <div class="w-8 h-8 border-4 border-sky-400 border-t-transparent rounded-full animate-spin mb-1"></div>
        <div id="loadingText" class="text-xs text-white font-semibold">Tuning Native ExoPlayer...</div>
      </div>

      <!-- TOP-LEFT INFO BAR -->
      <div id="topBar" class="absolute top-1 left-1 right-16 p-2 flex items-center justify-between bg-transparent border-0 outline-none z-20 transition-opacity duration-250 pointer-events-none">
        <div class="flex items-center gap-3 min-w-0 pointer-events-auto">
          <img id="nowPlayingLogo" src="" alt="" class="hidden w-10 h-10 rounded-xl object-contain bg-black/55 p-1 border border-white/15 shrink-0" onerror="this.classList.add('hidden')" />
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <div id="nowPlayingTitle" class="text-sm font-bold text-white truncate max-w-xs drop-shadow-[0_2px_4px_rgba(0,0,0,0.95)]">Select a Channel</div>
              <span id="drmBadge" class="hidden text-[9px] px-1.5 py-0.5 rounded bg-amber-500/30 text-amber-300 font-bold">DRM</span>
              <span id="subBadge" class="hidden text-[9px] px-1.5 py-0.5 rounded bg-sky-500/30 text-sky-300 font-bold">SUB: MALAY</span>
              <span id="audBadge" class="hidden text-[9px] px-1.5 py-0.5 rounded bg-emerald-500/30 text-emerald-300 font-bold">AUD: MALAY</span>
            </div>
            <div id="nowPlayingEpg" class="text-[11px] text-sky-300 truncate max-w-md drop-shadow-[0_2px_4px_rgba(0,0,0,0.95)]">Live Stream Ready</div>
          </div>
        </div>
      </div>

      <!-- TOP-RIGHT VERTICAL ICON STACK (Search -> Favourite Star -> Channel Jump TV -> Settings Gear) -->
      <div id="rightActionStack" class="absolute top-1 right-1 flex flex-col gap-2 z-20 transition-opacity duration-250">
        <!-- 1. Search Icon -->
        <button id="btnOpenSearch" type="button" title="Search Channel" class="w-11 h-11 rounded-2xl glass flex items-center justify-center text-white hover:border-sky-400 active:scale-95 shadow-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"></circle>
            <path stroke-linecap="round" d="M20 20l-3.5-3.5"></path>
          </svg>
        </button>

        <!-- 2. Star Icon (Mark Current Channel as Favourite) -->
        <button id="btnToggleCurrentFav" type="button" title="Mark Channel as Favourite" class="w-11 h-11 rounded-2xl glass flex items-center justify-center text-white/80 hover:border-amber-400 active:scale-95 shadow-lg">
          <svg id="starIconSvg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"></path>
          </svg>
        </button>

        <!-- 3. Channel Jump TV Icon -->
        <button id="btnOpenChannelJump" type="button" title="Channel Jump" class="w-11 h-11 rounded-2xl glass flex items-center justify-center text-white hover:border-sky-400 active:scale-95 shadow-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="2" y="6" width="20" height="14" rx="2" ry="2"></rect>
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 2l-5 4-5-4"></path>
          </svg>
        </button>

        <!-- 4. Settings Gear Icon -->
        <button id="btnOpenSettings" type="button" title="Settings" class="w-11 h-11 rounded-2xl glass flex items-center justify-center text-white hover:border-sky-400 active:scale-95 shadow-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

    </section>
  </main>

  <!-- BOTTOM FAVOURITES BAR -->
  <section id="channelDeck" class="glass rounded-3xl p-2.5 h-28 shrink-0 flex flex-col justify-between transition-opacity duration-250 z-20">
    <div class="flex justify-between items-center px-1.5 text-[11px] font-bold text-white/80">
      <div class="flex items-center gap-2">
        <span class="text-amber-400">★</span>
        <span>Favourite Channels (<span id="favCountBadge">0</span>)</span>
        <span id="epgStatusBadge" class="text-[10px] text-emerald-400 font-normal"></span>
      </div>
      <button id="btnOpenFavManagerHeader" type="button" class="text-[10px] text-sky-300 hover:text-sky-200 px-2 py-0.5 rounded-lg bg-white/5 border border-white/10">+ Select Favourites</button>
    </div>
    <div id="channelGrid" class="flex items-center gap-2 overflow-x-auto no-scrollbar h-full pt-1"></div>
  </section>

  <!-- 1. SEARCH MODAL (Magnifying Glass) -->
  <div id="modalSearch" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="glass rounded-2xl max-w-md w-full p-4 flex flex-col gap-3 max-h-[85dvh]">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold text-white">Search Channel</h2>
        <button class="btnCloseModal text-xs text-white/60 hover:text-white px-2 py-0.5">✕</button>
      </div>
      <input id="searchModalInput" type="text" placeholder="Type channel name..." class="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/15 text-xs text-white placeholder-white/40 focus:outline-none focus:border-sky-400" />
      <div id="searchResultsList" class="flex-1 overflow-y-auto space-y-1.5 pr-1 max-h-64"></div>
    </div>
  </div>

  <!-- 2. CHANNEL JUMP MODAL (TV Icon) -->
  <div id="modalChannelJump" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="glass rounded-2xl max-w-md w-full p-4 flex flex-col gap-3 max-h-[85dvh]">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold text-white">Channel Jump (<span id="totalChannelCount">0</span>)</h2>
        <button class="btnCloseModal text-xs text-white/60 hover:text-white px-2 py-0.5">✕</button>
      </div>
      <div>
        <label class="block text-[10px] text-white/50 mb-1">Category Group</label>
        <select id="groupSelect" class="w-full px-3 py-2 rounded-xl bg-[#141824] border border-white/15 text-xs text-white focus:outline-none focus:border-sky-400"></select>
      </div>
      <div id="jumpChannelList" class="flex-1 overflow-y-auto space-y-1.5 pr-1 max-h-64"></div>
    </div>
  </div>

  <!-- 3. FAVOURITE SELECTOR MODAL (Plus Icon / Radio Buttons) -->
  <div id="modalFavSelector" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="glass rounded-2xl max-w-md w-full p-4 flex flex-col gap-3 max-h-[85dvh]">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold text-white">Select Favourite Channels</h2>
        <button class="btnCloseModal text-xs text-white/60 hover:text-white px-2 py-0.5">✕</button>
      </div>
      <input id="favFilterInput" type="text" placeholder="Filter channels..." class="w-full px-3 py-1.5 rounded-xl bg-white/5 border border-white/15 text-xs text-white placeholder-white/40 focus:outline-none focus:border-sky-400" />
      <div id="favRadioList" class="flex-1 overflow-y-auto space-y-1.5 pr-1 max-h-64"></div>
      <div class="flex justify-end pt-1">
        <button class="btnCloseModal px-4 py-1.5 rounded-xl bg-sky-500 text-black font-bold text-xs">Done</button>
      </div>
    </div>
  </div>

  <!-- 4. UNIFIED SETTINGS MODAL (Gear Icon) -->
  <div id="modalSettings" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="glass rounded-2xl max-w-md w-full p-4 flex flex-col gap-3 max-h-[90dvh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-white/10 pb-2">
        <h2 class="text-xs font-bold text-white">Player & Playlist Settings</h2>
        <button class="btnCloseModal text-xs text-white/60 hover:text-white px-2 py-0.5">✕</button>
      </div>

      <!-- M3U URL & File -->
      <div class="space-y-1.5">
        <label class="block text-[10px] text-sky-300 font-semibold">1. M3U Playlist URL or Local File</label>
        <input id="m3uUrlInput" type="url" placeholder="https://example.com/playlist.m3u" class="w-full px-3 py-1.5 rounded-xl bg-white/5 border border-white/15 text-xs text-white" />
        <input id="m3uFileInput" type="file" accept=".m3u,.m3u8,.txt" class="w-full text-[11px] text-white/70" />
      </div>

      <!-- EPG URL -->
      <div>
        <label class="block text-[10px] text-sky-300 font-semibold mb-1">2. EPG XMLTV URL (Auto-detected if inside M3U)</label>
        <input id="epgUrlInput" type="url" placeholder="https://example.com/epg.xml.gz" class="w-full px-3 py-1.5 rounded-xl bg-white/5 border border-white/15 text-xs text-white" />
      </div>

      <!-- User-Agent Spoofing -->
      <div>
        <label class="block text-[10px] text-sky-300 font-semibold mb-1">3. Global User-Agent Spoofing</label>
        <select id="uaPresetSelect" class="w-full px-3 py-2 rounded-xl bg-[#141824] border border-white/15 text-xs text-white">
          <option value="TiviMate/4.7.0 (Linux; Android 13)">TiviMate/4.7.0 (Android 13)</option>
          <option value="OTT Navigator/1.6.9.4 (Linux; Android 13)">OTT Navigator/1.6.9.4 (Android 13)</option>
          <option value="TiviMate/5.1.0 (Linux; Android 14)">TiviMate/5.1.0 (Android 14)</option>
          <option value="Dalvik/2.1.0 (Linux; U; Android 13; Shield Android TV Build/RQ1A.210105.003)">Android TV Dalvik (ExoPlayer)</option>
        </select>
      </div>

      <!-- Global Preferred Subtitle -->
      <div>
        <label class="block text-[10px] text-sky-300 font-semibold mb-1">4. Preferred Subtitle (All Channels)</label>
        <select id="subPrefSelect" class="w-full px-3 py-2 rounded-xl bg-[#141824] border border-white/15 text-xs text-white">
          <option value="ms_en">Malay 1st, English 2nd (Default)</option>
          <option value="en_ms">English 1st, Malay 2nd</option>
          <option value="ms">Malay Only</option>
          <option value="en">English Only</option>
          <option value="off">Subtitles Off</option>
        </select>
      </div>

      <!-- Global Preferred Audio Track -->
      <div>
        <label class="block text-[10px] text-sky-300 font-semibold mb-1">5. Audio Track Selector (All Channels)</label>
        <select id="audioPrefSelect" class="w-full px-3 py-2 rounded-xl bg-[#141824] border border-white/15 text-xs text-white">
          <option value="ms_en">Malay 1st, English 2nd (Default)</option>
          <option value="en_ms">English 1st, Malay 2nd</option>
          <option value="ms">Malay Audio Preferred</option>
          <option value="en">English Audio Preferred</option>
          <option value="default">Channel Default Audio</option>
        </select>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t border-white/10">
        <button class="btnCloseModal px-3 py-1.5 rounded-xl bg-white/10 text-xs font-semibold">Cancel</button>
        <button id="btnSaveAllSettings" class="px-4 py-1.5 rounded-xl bg-sky-500 text-black font-bold text-xs">Save & Apply</button>
      </div>
    </div>
  </div>

  <script>
    const savedFavs = (() => {
      try {
        return JSON.parse(localStorage.getItem('tvos_favorites') || '[]');
      } catch (e) {
        return [];
      }
    })();

    const state = {
      channels: [
        { id: '1', name: 'Angel One (DASH)', group: 'Demo', tvgId: '', logo: '', url: 'https://storage.googleapis.com/shaka-demo-assets/angel-one/dash.mpd', type: 'mpd', userAgent: '', referer: '', licenseUrl: '', clearKey: '' },
        { id: '2', name: 'Apple BipBop (HLS)', group: 'Demo', tvgId: '', logo: '', url: 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8', type: 'hls', userAgent: '', referer: '', licenseUrl: '', clearKey: '' }
      ],
      favorites: new Set(savedFavs),
      group: 'All',
      current: null,
      globalUA: localStorage.getItem('tvos_ua') || 'TiviMate/4.7.0 (Linux; Android 13)',
      subPref: localStorage.getItem('tvos_sub_pref') || 'ms_en',
      audioPref: localStorage.getItem('tvos_audio_pref') || 'ms_en',
      epgMap: {},
      uiVisible: true
    };

    const hasBridge = () => typeof window.AndroidBridge !== 'undefined';

    function favKey(ch) {
      return (ch.name || '').trim();
    }

    function isChannelFav(ch) {
      return ch ? state.favorites.has(favKey(ch)) : false;
    }

    function saveFavorites() {
      localStorage.setItem('tvos_favorites', JSON.stringify([...state.favorites]));
      updateStarButtonState();
      renderFavoritesDeck();
    }

    function toggleChannelFav(ch) {
      if (!ch) return;
      const k = favKey(ch);
      if (state.favorites.has(k)) {
        state.favorites.delete(k);
      } else {
        state.favorites.add(k);
      }
      saveFavorites();
    }

    function updateStarButtonState() {
      const btn = document.getElementById('btnToggleCurrentFav');
      const svg = document.getElementById('starIconSvg');
      const active = isChannelFav(state.current);
      if (active) {
        btn.classList.add('border-amber-400');
        svg.setAttribute('fill', '#fbbf24');
        svg.setAttribute('stroke', '#fbbf24');
      } else {
        btn.classList.remove('border-amber-400');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
      }
    }

    function anyModalOpen() {
      return ['modalSearch', 'modalChannelJump', 'modalFavSelector', 'modalSettings'].some(
        id => !document.getElementById(id).classList.contains('hidden')
      );
    }

    function closeAllModals() {
      ['modalSearch', 'modalChannelJump', 'modalFavSelector', 'modalSettings'].forEach(
        id => document.getElementById(id).classList.add('hidden')
      );
      startUiHideTimer();
    }

    let hideUiTimer = null;

    function startUiHideTimer() {
      clearTimeout(hideUiTimer);
      hideUiTimer = setTimeout(() => {
        if (!anyModalOpen()) hideUi();
      }, 4000);
    }

    function hideUi() {
      state.uiVisible = false;
      document.getElementById('topBar').classList.add('ui-hidden');
      document.getElementById('rightActionStack').classList.add('ui-hidden');
      document.getElementById('channelDeck').classList.add('ui-hidden');
      document.getElementById('wakeShield').classList.remove('hidden');
    }

    function showUi() {
      state.uiVisible = true;
      document.getElementById('topBar').classList.remove('ui-hidden');
      document.getElementById('rightActionStack').classList.remove('ui-hidden');
      document.getElementById('channelDeck').classList.remove('ui-hidden');
      startUiHideTimer();
    }

    // Wake shield consumes the first tap when fullscreen so no underlying button triggers prematurely
    const wakeShield = document.getElementById('wakeShield');
    wakeShield.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      showUi();
      setTimeout(() => {
        if (state.uiVisible) wakeShield.classList.add('hidden');
      }, 150);
    });

    ['rightActionStack', 'channelDeck', 'topBar'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (state.uiVisible) startUiHideTimer();
      });
      el.addEventListener('scroll', () => {
        if (state.uiVisible) startUiHideTimer();
      }, true);
    });

    window.onNativePlayerState = (s) => {
      document.getElementById('loading').classList.toggle('hidden', s !== 'BUFFERING');
    };

    window.onNativePlayerError = () => {
      document.getElementById('loading').classList.add('hidden');
    };

    window.onTrackBadgesUpdated = (subLabel, audLabel) => {
      const sBadge = document.getElementById('subBadge');
      if (subLabel) {
        sBadge.textContent = 'SUB: ' + subLabel;
        sBadge.classList.remove('hidden');
      } else {
        sBadge.classList.add('hidden');
      }

      const aBadge = document.getElementById('audBadge');
      if (audLabel) {
        aBadge.textContent = 'AUD: ' + audLabel;
        aBadge.classList.remove('hidden');
      } else {
        aBadge.classList.add('hidden');
      }
    };

    window.onNativeEpgLoaded = (rawJson) => {
      try {
        const parsed = typeof rawJson === 'string' ? JSON.parse(rawJson) : rawJson;
        if (parsed && parsed.epg) {
          state.epgMap = parsed.epg;
          const count = Object.keys(state.epgMap).length;
          document.getElementById('epgStatusBadge').textContent = count ? `• EPG (${count})` : '';
          updateCurrentChannelEpgBanner();
          renderFavoritesDeck();
        }
      } catch (e) {}
    };

    function getChannelEpg(ch) {
      if (!ch) return null;
      const idKey = (ch.tvgId || '').toLowerCase();
      const nameKey = (ch.name || '').toLowerCase();
      return state.epgMap[idKey] || state.epgMap[nameKey] || null;
    }

    function updateCurrentChannelEpgBanner() {
      const epgEl = document.getElementById('nowPlayingEpg');
      if (!state.current) {
        epgEl.textContent = 'Live Stream Ready';
        return;
      }
      const info = getChannelEpg(state.current);
      if (info && info.now) {
        const nextPart = info.next ? ` • Next: ${info.next}` : '';
        epgEl.textContent = `Now: ${info.now} (${info.time})${nextPart}`;
      } else {
        epgEl.textContent = state.current.group || 'Live TV';
      }
    }

    window.playChannel = (ch) => {
      if (!ch) return;
      state.current = ch;
      document.getElementById('nowPlayingTitle').textContent = ch.name;

      const logoEl = document.getElementById('nowPlayingLogo');
      if (ch.logo) {
        logoEl.src = ch.logo;
        logoEl.classList.remove('hidden');
      } else {
        logoEl.classList.add('hidden');
      }

      updateCurrentChannelEpgBanner();
      updateStarButtonState();
      renderFavoritesDeck();

      document.getElementById('drmBadge').classList.toggle('hidden', !ch.licenseUrl && !ch.clearKey);
      document.getElementById('subBadge').classList.add('hidden');
      document.getElementById('audBadge').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');

      if (hasBridge()) {
        if (window.AndroidBridge.setLanguagePreferences) {
          window.AndroidBridge.setLanguagePreferences(state.subPref, state.audioPref);
        }
        window.AndroidBridge.playNativeStream(
          ch.url,
          ch.type || 'auto',
          ch.userAgent || state.globalUA,
          ch.referer || '',
          ch.licenseUrl || '',
          ch.clearKey || ''
        );
      }
      startUiHideTimer();
    };

    // Renders the bottom Favourites bar (or the '+' placeholder button if no favourites yet)
    function renderFavoritesDeck() {
      const grid = document.getElementById('channelGrid');
      const favChannels = state.channels.filter(ch => isChannelFav(ch));
      document.getElementById('favCountBadge').textContent = favChannels.length;
      grid.innerHTML = '';

      if (favChannels.length === 0) {
        const plusBtn = document.createElement('button');
        plusBtn.type = 'button';
        plusBtn.className = 'w-full h-full rounded-2xl border border-dashed border-white/25 hover:border-sky-400 bg-white/5 flex items-center justify-center gap-2.5 text-white/80 hover:text-white active:scale-[0.99] transition';
        plusBtn.innerHTML = `
          <span class="w-8 h-8 rounded-full bg-sky-500/20 border border-sky-400/40 text-sky-300 flex items-center justify-center text-lg font-bold">+</span>
          <span class="text-xs font-semibold">No Favourite Channels Yet — Tap + to Select Channels</span>
        `;
        plusBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!state.uiVisible) return;
          openFavSelectorModal();
        });
        grid.appendChild(plusBtn);
        return;
      }

      favChannels.forEach(ch => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `glass rounded-2xl p-2 w-44 shrink-0 text-left h-full flex flex-col justify-between ${state.current?.id === ch.id ? 'glass-active border-sky-400' : ''}`;

        const topRow = document.createElement('div');
        topRow.className = 'flex items-center gap-2 min-w-0';

        if (ch.logo) {
          const img = document.createElement('img');
          img.src = ch.logo;
          img.loading = 'lazy';
          img.className = 'w-6 h-6 rounded-lg object-contain bg-black/40 p-0.5 shrink-0';
          img.onerror = function() { this.style.display = 'none'; };
          topRow.appendChild(img);
        }

        const titleEl = document.createElement('div');
        titleEl.className = 'text-xs font-bold text-white truncate';
        titleEl.textContent = ch.name;
        topRow.appendChild(titleEl);

        const epgInfo = getChannelEpg(ch);
        const subRow = document.createElement('div');
        subRow.className = 'text-[10px] text-sky-300 truncate';
        subRow.textContent = (epgInfo && epgInfo.now) ? epgInfo.now : ch.group;

        btn.appendChild(topRow);
        btn.appendChild(subRow);

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!state.uiVisible) return;
          window.playChannel(ch);
        });

        grid.appendChild(btn);
      });

      // Add a compact '+' tile at the end of the scrollable bar as well
      const addTile = document.createElement('button');
      addTile.type = 'button';
      addTile.className = 'glass rounded-2xl w-14 shrink-0 h-full flex items-center justify-center text-sky-300 hover:border-sky-400 text-lg font-bold';
      addTile.textContent = '+';
      addTile.title = 'Add or Edit Favourites';
      addTile.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!state.uiVisible) return;
        openFavSelectorModal();
      });
      grid.appendChild(addTile);
    }

    // Populates the Favourite Selector Modal with Radio-Style Buttons
    function openFavSelectorModal() {
      closeAllModals();
      const modal = document.getElementById('modalFavSelector');
      const input = document.getElementById('favFilterInput');
      input.value = '';
      modal.classList.remove('hidden');
      renderFavRadioList('');
    }

    function renderFavRadioList(query) {
      const q = (query || '').toLowerCase();
      const container = document.getElementById('favRadioList');
      container.innerHTML = '';

      const matches = state.channels.filter(c => !q || c.name.toLowerCase().includes(q) || (c.group || '').toLowerCase().includes(q)).slice(0, 300);

      matches.forEach(ch => {
        const row = document.createElement('div');
        const checked = isChannelFav(ch);
        row.className = `flex items-center justify-between p-2 rounded-xl border cursor-pointer ${checked ? 'bg-sky-500/15 border-sky-400/50' : 'bg-white/5 border-white/10'}`;

        const left = document.createElement('div');
        left.className = 'flex items-center gap-2.5 min-w-0';

        const radio = document.createElement('div');
        radio.className = `radio-dot ${checked ? 'radio-dot-active' : ''}`;
        left.appendChild(radio);

        if (ch.logo) {
          const img = document.createElement('img');
          img.src = ch.logo;
          img.className = 'w-6 h-6 rounded object-contain bg-black/40 p-0.5 shrink-0';
          img.onerror = function() { this.style.display = 'none'; };
          left.appendChild(img);
        }

        const textWrap = document.createElement('div');
        textWrap.className = 'min-w-0';
        textWrap.innerHTML = `<div class="text-xs font-semibold text-white truncate">${ch.name}</div><div class="text-[10px] text-white/50 truncate">${ch.group}</div>`;
        left.appendChild(textWrap);

        row.appendChild(left);
        row.addEventListener('click', () => {
          toggleChannelFav(ch);
          renderFavRadioList(document.getElementById('favFilterInput').value);
        });
        container.appendChild(row);
      });
    }

    document.getElementById('favFilterInput').addEventListener('input', (e) => {
      renderFavRadioList(e.target.value);
    });

    // Search Modal (Magnifying Glass)
    function openSearchModal() {
      closeAllModals();
      const modal = document.getElementById('modalSearch');
      const input = document.getElementById('searchModalInput');
      input.value = '';
      modal.classList.remove('hidden');
      renderSearchResults('');
      setTimeout(() => input.focus(), 50);
    }

    function renderSearchResults(query) {
      const q = (query || '').toLowerCase();
      const list = document.getElementById('searchResultsList');
      list.innerHTML = '';

      const results = state.channels.filter(c => !q || c.name.toLowerCase().includes(q)).slice(0, 200);
      results.forEach(ch => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = `w-full flex items-center justify-between p-2 rounded-xl border text-left ${state.current?.id === ch.id ? 'bg-sky-500/20 border-sky-400' : 'bg-white/5 border-white/10 hover:bg-white/10'}`;
        item.innerHTML = `
          <div class="flex items-center gap-2.5 min-w-0">
            ${ch.logo ? `<img src="${ch.logo}" class="w-6 h-6 rounded object-contain bg-black/40 p-0.5 shrink-0" onerror="this.style.display='none'" />` : ''}
            <div class="min-w-0">
              <div class="text-xs font-bold text-white truncate">${ch.name}</div>
              <div class="text-[10px] text-sky-300 truncate">${ch.group}</div>
            </div>
          </div>
          <span class="text-[10px] text-white/50 pl-2">Play ▶</span>
        `;
        item.addEventListener('click', () => {
          closeAllModals();
          window.playChannel(ch);
        });
        list.appendChild(item);
      });
    }

    document.getElementById('searchModalInput').addEventListener('input', (e) => {
      renderSearchResults(e.target.value);
    });

    // Channel Jump Modal (TV Icon)
    function openChannelJumpModal() {
      closeAllModals();
      document.getElementById('totalChannelCount').textContent = state.channels.length;
      const gs = document.getElementById('groupSelect');
      gs.innerHTML = '';
      ['All', ...new Set(state.channels.map(c => c.group))].forEach(g => {
        const o = document.createElement('option');
        o.value = g;
        o.textContent = g;
        if (g === state.group) o.selected = true;
        gs.appendChild(o);
      });
      renderJumpChannelList();
      document.getElementById('modalChannelJump').classList.remove('hidden');
    }

    function renderJumpChannelList() {
      const list = document.getElementById('jumpChannelList');
      list.innerHTML = '';
      const filtered = state.channels.filter(c => state.group === 'All' || c.group === state.group).slice(0, 350);

      filtered.forEach((ch, idx) => {
        const row = document.createElement('div');
        row.className = `flex items-center justify-between p-2 rounded-xl border cursor-pointer ${state.current?.id === ch.id ? 'bg-sky-500/20 border-sky-400' : 'bg-white/5 border-white/10 hover:bg-white/10'}`;

        const left = document.createElement('div');
        left.className = 'flex items-center gap-2.5 min-w-0 flex-1';
        left.innerHTML = `
          <span class="text-[10px] text-white/40 w-5">${idx + 1}.</span>
          ${ch.logo ? `<img src="${ch.logo}" class="w-6 h-6 rounded object-contain bg-black/40 p-0.5 shrink-0" onerror="this.style.display='none'" />` : ''}
          <div class="min-w-0">
            <div class="text-xs font-bold text-white truncate">${ch.name}</div>
            <div class="text-[10px] text-sky-300 truncate">${getChannelEpg(ch)?.now || ch.group}</div>
          </div>
        `;
        left.addEventListener('click', () => {
          closeAllModals();
          window.playChannel(ch);
        });

        const favBtn = document.createElement('button');
        favBtn.type = 'button';
        const favActive = isChannelFav(ch);
        favBtn.className = `px-2 py-1 text-sm ${favActive ? 'text-amber-400' : 'text-white/30 hover:text-white/70'}`;
        favBtn.textContent = '★';
        favBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleChannelFav(ch);
          renderJumpChannelList();
        });

        row.appendChild(left);
        row.appendChild(favBtn);
        list.appendChild(row);
      });
    }

    document.getElementById('groupSelect').addEventListener('change', (e) => {
      state.group = e.target.value;
      renderJumpChannelList();
    });

    function triggerEpgLoad(epgUrl) {
      const clean = (epgUrl || '').trim();
      if (!clean) return;
      document.getElementById('epgStatusBadge').textContent = '• Loading EPG...';
      if (hasBridge() && window.AndroidBridge.loadNativeEpg) {
        window.AndroidBridge.loadNativeEpg(clean, state.globalUA);
      }
    }

    window.parseM3UAndLoad = (rawText, saveUrl = '', customEpgUrl = '') => {
      if (!rawText || !rawText.includes('#EXTINF')) return;
      const lines = rawText.split(/\r?\n/);
      const parsed = [];
      let detectedEpgUrl = customEpgUrl || '';
      let currentMeta = null;
      let pendingUA = '';
      let pendingReferer = '';
      let pendingLicense = '';
      let pendingClearKey = '';
      let pendingLicenseType = '';
      let pendingManifestType = '';

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTM3U')) {
          const epgMatch = line.match(/(?:url-tvg|x-tvg-url)="([^"]+)"/i);
          if (epgMatch && !detectedEpgUrl) {
            detectedEpgUrl = epgMatch[1].split(',')[0].trim();
          }
        } else if (line.startsWith('#EXTINF:')) {
          const commaIdx = line.lastIndexOf(',');
          const name = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Channel';
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          const idMatch = line.match(/tvg-id="([^"]+)"/i);
          const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
          const uaAttr = line.match(/user-agent="([^"]+)"/i);
          if (uaAttr) pendingUA = uaAttr[1];
          currentMeta = {
            name,
            group: groupMatch ? groupMatch[1] : 'Live TV',
            tvgId: idMatch ? idMatch[1].trim() : '',
            logo: logoMatch ? logoMatch[1].trim() : ''
          };
        } else if (line.toLowerCase().startsWith('#extvlcopt:http-user-agent=')) {
          pendingUA = line.substring(line.indexOf('=') + 1).trim();
        } else if (line.toLowerCase().startsWith('#extvlcopt:http-referrer=') || line.toLowerCase().startsWith('#extvlcopt:http-referer=')) {
          pendingReferer = line.substring(line.indexOf('=') + 1).trim();
        } else if (line.toLowerCase().startsWith('#exthttp:')) {
          try {
            const j = JSON.parse(line.substring(9).trim());
            if (j['User-Agent'] || j['user-agent']) pendingUA = j['User-Agent'] || j['user-agent'];
            if (j['Referer'] || j['referer']) pendingReferer = j['Referer'] || j['referer'];
          } catch (e) {}
        } else if (line.toLowerCase().startsWith('#kodiprop:inputstream.adaptive.manifest_type=')) {
          const mType = line.substring(line.indexOf('=') + 1).trim().toLowerCase();
          if (mType.includes('mpd') || mType.includes('dash')) pendingManifestType = 'mpd';
          else if (mType.includes('hls')) pendingManifestType = 'hls';
        } else if (line.toLowerCase().startsWith('#kodiprop:inputstream.adaptive.license_type=')) {
          pendingLicenseType = line.substring(line.indexOf('=') + 1).trim().toLowerCase();
        } else if (line.toLowerCase().startsWith('#kodiprop:inputstream.adaptive.license_key=')) {
          const lKey = line.substring(line.indexOf('=') + 1).trim();
          const isClearKeyType = pendingLicenseType.includes('clearkey');
          if (isClearKeyType || lKey.startsWith('{') || (!lKey.startsWith('http') && lKey.includes(':'))) {
            pendingClearKey = lKey;
          } else if (lKey.startsWith('http')) {
            pendingLicense = lKey;
          }
        } else if (!line.startsWith('#')) {
          let streamUrl = line;
          if (line.includes('|')) {
            const pipeIdx = line.indexOf('|');
            streamUrl = line.substring(0, pipeIdx).trim();
            const headerPart = line.substring(pipeIdx + 1).trim();
            headerPart.split('&').forEach(pair => {
              const eqIdx = pair.indexOf('=');
              if (eqIdx !== -1) {
                const k = pair.substring(0, eqIdx).trim().toLowerCase();
                const v = decodeURIComponent(pair.substring(eqIdx + 1).trim());
                if (k === 'user-agent') pendingUA = v;
                else if (k === 'referer' || k === 'referrer' || k === 'origin') pendingReferer = v;
              }
            });
          }

          let streamType = pendingManifestType;
          if (!streamType) {
            const low = streamUrl.toLowerCase();
            if (low.includes('.mpd')) streamType = 'mpd';
            else if (low.includes('.m3u8')) streamType = 'hls';
            else streamType = 'auto';
          }

          parsed.push({
            id: 'm3u-' + parsed.length,
            name: currentMeta ? currentMeta.name : `Channel ${parsed.length + 1}`,
            group: currentMeta ? currentMeta.group : 'Live TV',
            tvgId: currentMeta ? currentMeta.tvgId : '',
            logo: currentMeta ? currentMeta.logo : '',
            url: streamUrl,
            type: streamType,
            userAgent: pendingUA || state.globalUA,
            referer: pendingReferer,
            licenseUrl: pendingLicense,
            clearKey: pendingClearKey
          });

          currentMeta = null;
          pendingUA = '';
          pendingReferer = '';
          pendingLicense = '';
          pendingClearKey = '';
          pendingLicenseType = '';
          pendingManifestType = '';
        }
      }

      if (parsed.length !== 0) {
        state.channels = parsed;
        state.group = 'All';
        if (saveUrl) localStorage.setItem('saved_m3u_url', saveUrl);
        if (detectedEpgUrl) {
          localStorage.setItem('saved_epg_url', detectedEpgUrl);
          document.getElementById('epgUrlInput').value = detectedEpgUrl;
          triggerEpgLoad(detectedEpgUrl);
        }
        renderFavoritesDeck();
      }
    };

    // Right-Side Icon Stack Handlers
    document.getElementById('btnOpenSearch').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!state.uiVisible) return;
      openSearchModal();
    });

    document.getElementById('btnToggleCurrentFav').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!state.uiVisible) return;
      if (state.current) {
        toggleChannelFav(state.current);
      } else {
        openFavSelectorModal();
      }
      startUiHideTimer();
    });

    document.getElementById('btnOpenChannelJump').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!state.uiVisible) return;
      openChannelJumpModal();
    });

    document.getElementById('btnOpenSettings').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!state.uiVisible) return;
      closeAllModals();
      document.getElementById('uaPresetSelect').value = state.globalUA;
      document.getElementById('subPrefSelect').value = state.subPref;
      document.getElementById('audioPrefSelect').value = state.audioPref;
      document.getElementById('modalSettings').classList.remove('hidden');
    });

    document.getElementById('btnOpenFavManagerHeader').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!state.uiVisible) return;
      openFavSelectorModal();
    });

    document.querySelectorAll('.btnCloseModal').forEach(b => {
      b.addEventListener('click', () => closeAllModals());
    });

    // Save Unified Settings (M3U, EPG, UA, Subtitle Pref, Audio Pref)
    document.getElementById('btnSaveAllSettings').addEventListener('click', async () => {
      const uaVal = document.getElementById('uaPresetSelect').value;
      const subVal = document.getElementById('subPrefSelect').value;
      const audVal = document.getElementById('audioPrefSelect').value;
      const m3uUrl = document.getElementById('m3uUrlInput').value.trim();
      const epgUrl = document.getElementById('epgUrlInput').value.trim();

      state.globalUA = uaVal;
      state.subPref = subVal;
      state.audioPref = audVal;

      localStorage.setItem('tvos_ua', uaVal);
      localStorage.setItem('tvos_sub_pref', subVal);
      localStorage.setItem('tvos_audio_pref', audVal);

      if (hasBridge() && window.AndroidBridge.setLanguagePreferences) {
        window.AndroidBridge.setLanguagePreferences(subVal, audVal);
      }

      const prevSavedM3u = localStorage.getItem('saved_m3u_url') || '';
      if (m3uUrl && (m3uUrl !== prevSavedM3u || state.channels.length <= 2)) {
        const txt = hasBridge() ? window.AndroidBridge.fetchRemoteText(m3uUrl, state.globalUA) : await (await fetch(m3uUrl)).text();
        window.parseM3UAndLoad(txt, m3uUrl, epgUrl);
      } else if (epgUrl && epgUrl !== (localStorage.getItem('saved_epg_url') || '')) {
        localStorage.setItem('saved_epg_url', epgUrl);
        triggerEpgLoad(epgUrl);
      }

      closeAllModals();
    });

    document.getElementById('m3uFileInput').addEventListener('change', (e) => {
      const f = e.target.files[0];
      const epgU = document.getElementById('epgUrlInput').value.trim();
      if (!f) return;
      const r = new FileReader();
      r.onload = (ev) => {
        window.parseM3UAndLoad(ev.target.result, '', epgU);
        closeAllModals();
      };
      r.readAsText(f);
    });

    // Tapping empty video area while UI is visible hides overlays into clean fullscreen
    document.getElementById('videoOverlayContainer').addEventListener('click', (e) => {
      if (e.target.id === 'videoOverlayContainer' || e.target.id === 'loading') {
        if (state.uiVisible) {
          hideUi();
        }
      }
    });

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('uaPresetSelect').value = state.globalUA;
      document.getElementById('subPrefSelect').value = state.subPref;
      document.getElementById('audioPrefSelect').value = state.audioPref;

      if (hasBridge() && window.AndroidBridge.setLanguagePreferences) {
        window.AndroidBridge.setLanguagePreferences(state.subPref, state.audioPref);
      }

      const savedUrl = localStorage.getItem('saved_m3u_url') || '';
      const savedEpg = localStorage.getItem('saved_epg_url') || '';
      if (savedEpg) document.getElementById('epgUrlInput').value = savedEpg;

      if (savedUrl) {
        document.getElementById('m3uUrlInput').value = savedUrl;
        const txt = hasBridge() ? window.AndroidBridge.fetchRemoteText(savedUrl, state.globalUA) : await (await fetch(savedUrl)).text();
        window.parseM3UAndLoad(txt, savedUrl, savedEpg);
      } else {
        renderFavoritesDeck();
      }
      showUi();
    });
  </script>
</body>
</html>
