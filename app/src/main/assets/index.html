<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Coolwalk IPTV — Native ExoPlayer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { background: transparent !important; color: #f5f5f7; overflow: hidden; height: 100dvh; width: 100vw; margin: 0; font-family: system-ui, sans-serif; }
    .glass { background: rgba(18, 19, 26, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); }
    .glass-active { background: rgba(14, 165, 233, 0.35); border-color: #38bdf8 !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="flex h-full w-full p-2 gap-2 bg-transparent">

  <!-- LEFT SIDEBAR -->
  <aside class="glass rounded-3xl w-64 h-full flex flex-col justify-between p-3 shrink-0 z-20">
    <div class="space-y-2.5">
      <div class="flex items-center justify-between pb-2 border-b border-white/10">
        <div>
          <div class="font-bold text-xs text-white">Coolwalk IPTV <span class="text-[9px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300">EXO</span></div>
          <div id="activeUaBadge" class="text-[10px] text-sky-300 truncate max-w-[140px]">UA: TiviMate/5.3.3</div>
        </div>
      </div>

      <input id="searchInput" type="text" placeholder="Search channel..." class="w-full px-3 py-1.5 rounded-xl bg-white/5 border border-white/15 text-xs text-white placeholder-white/40 focus:outline-none focus:border-sky-400" />

      <div>
        <label class="block text-[10px] text-white/50 mb-0.5">Category Group</label>
        <select id="groupSelect" class="w-full px-2.5 py-1.5 rounded-xl bg-[#141824] border border-white/15 text-xs text-white focus:outline-none focus:border-sky-400 cursor-pointer"></select>
      </div>

      <div>
        <label class="block text-[10px] text-white/50 mb-0.5">Quick Channel Jump</label>
        <select id="quickChannelSelect" class="w-full px-2.5 py-1.5 rounded-xl bg-[#141824] border border-white/15 text-xs text-sky-300 focus:outline-none focus:border-sky-400 cursor-pointer"></select>
      </div>
    </div>

    <div class="space-y-1.5 pt-2 border-t border-white/10">
      <button id="btnOpenModal" class="w-full py-2 px-3 rounded-xl glass text-left text-xs font-semibold text-white flex items-center gap-2"><span>📂</span> Load M3U & EPG</button>
      <button id="btnOpenUaModal" class="w-full py-2 px-3 rounded-xl glass text-left text-xs font-semibold text-white flex items-center gap-2"><span>⚙️</span> User-Agent Settings</button>
    </div>
  </aside>

  <!-- MAIN VIEW -->
  <main class="flex-1 flex flex-col gap-2 h-full overflow-hidden">
    <section class="relative flex-1 rounded-3xl overflow-hidden bg-transparent border border-white/20 flex items-center justify-center">
      <div id="loading" class="hidden absolute inset-0 bg-black/40 backdrop-blur-xs flex flex-col items-center justify-center z-10 pointer-events-none">
        <div class="w-8 h-8 border-4 border-sky-400 border-t-transparent rounded-full animate-spin mb-1"></div>
        <div id="loadingText" class="text-xs text-white font-semibold">Tuning Native ExoPlayer...</div>
      </div>

      <div class="absolute top-0 inset-x-0 p-3 flex items-center justify-between bg-gradient-to-b from-black/80 to-transparent z-10">
        <div>
          <div id="nowPlayingTitle" class="text-xs font-bold text-white truncate max-w-xs">Select a Channel</div>
          <div id="nowPlayingEpg" class="text-[10px] text-sky-300 truncate max-w-xs">Live EPG Ready</div>
        </div>
        <button id="btnPlayPause" class="px-3.5 py-1 rounded-xl bg-white text-black font-bold text-xs">Pause</button>
      </div>
    </section>

    <!-- CHANNEL DECK -->
    <section class="glass rounded-3xl p-2.5 h-32 shrink-0 flex flex-col justify-between">
      <div class="flex justify-between px-1 text-[11px] font-bold text-white/80">
        <span>Channels (<span id="channelCountBadge">0</span>)</span>
      </div>
      <div id="channelGrid" class="flex items-center gap-2 overflow-x-auto no-scrollbar h-full"></div>
    </section>
  </main>

  <!-- MODAL: LOAD M3U & EPG -->
  <div id="modalM3u" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="glass rounded-2xl max-w-md w-full p-4 space-y-3">
      <h2 class="text-xs font-bold text-white">Load M3U Playlist & EPG</h2>
      <div>
        <label class="block text-[10px] text-white/60 mb-1">Remote M3U URL</label>
        <input id="m3uUrlInput" type="url" placeholder="https://example.com/playlist.m3u" class="w-full px-3 py-1.5 rounded-xl bg-white/5 border border-white/15 text-xs text-white focus:outline-none focus:border-sky-400" />
      </div>
      <div>
        <label class="block text-[10px] text-white/60 mb-1">XMLTV EPG URL (Optional Fast Parser)</label>
        <input id="epgUrlInput" type="url" placeholder="https://example.com/epg.xml" class="w-full px-3 py-1.5 rounded-xl bg-white/5 border border-white/15 text-xs text-white focus:outline-none focus:border-sky-400" />
      </div>
      <div>
        <label class="block text-[10px] text-white/60 mb-1">Or Local .M3U File</label>
        <input id="m3uFileInput" type="file" accept=".m3u,.m3u8,.txt" class="w-full text-xs text-white/70" />
      </div>
      <div class="flex justify-end gap-2 pt-1">
        <button class="btnCloseModal px-3 py-1.5 rounded-xl bg-white/10 text-xs font-semibold">Cancel</button>
        <button id="btnFetchM3uUrl" class="px-4 py-1.5 rounded-xl bg-sky-500 text-black font-bold text-xs">Load URL</button>
      </div>
    </div>
  </div>

  <!-- MODAL: USER-AGENT SETTINGS -->
  <div id="modalUA" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="glass rounded-2xl max-w-md w-full p-4 space-y-3">
      <h2 class="text-xs font-bold text-white">Global User-Agent Spoofing</h2>
      <select id="uaPresetSelect" class="w-full px-3 py-2 rounded-xl bg-[#141824] border border-white/15 text-xs text-white focus:outline-none focus:border-sky-400">
        <option value="TiviMate/5.3.3 (Linux; Android 13)">TiviMate 5.3.3 (Android 13)</option>
        <option value="OTT Navigator/1.7.5.1 (Linux; Android 13)">OTT Navigator 1.7.5.1 (Android 13)</option>
        <option value="VLC/3.0.18 (Linux; Android 13)">VLC Player</option>
        <option value="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36">Standard Chrome Desktop</option>
      </select>
      <div class="flex justify-end gap-2 pt-1">
        <button class="btnCloseModal px-3 py-1.5 rounded-xl bg-white/10 text-xs font-semibold">Cancel</button>
        <button id="btnSaveUaSettings" class="px-4 py-1.5 rounded-xl bg-sky-500 text-black font-bold text-xs">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      channels: [
        { id: '1', name: 'Angel One (DASH .mpd)', group: 'Demo', tvgId: 'angel', url: 'https://storage.googleapis.com/shaka-demo-assets/angel-one/dash.mpd', type: 'mpd', userAgent: 'TiviMate/5.3.3 (Linux; Android 13)', referer: '' },
        { id: '2', name: 'Apple BipBop (HLS .m3u8)', group: 'Demo', tvgId: 'bipbop', url: 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8', type: 'hls', userAgent: 'OTT Navigator/1.7.5.1 (Linux; Android 13)', referer: '' }
      ],
      filtered: [], group: 'All', search: '', current: null,
      globalUA: localStorage.getItem('tvos_ua') || 'TiviMate/5.3.3 (Linux; Android 13)',
      epgMap: {}
    };

    const hasBridge = () => typeof window.AndroidBridge !== 'undefined';

    window.onNativePlayerState = (s) => {
      document.getElementById('loading').classList.toggle('hidden', s !== 'BUFFERING');
    };
    window.onNativePlayerError = (msg) => {
      document.getElementById('loading').classList.add('hidden');
      alert('ExoPlayer Error: ' + msg);
    };

    window.playChannel = (ch) => {
      if (!ch) return;
      state.current = ch;
      applyFilters();
      document.getElementById('quickChannelSelect').value = ch.id;
      document.getElementById('nowPlayingTitle').textContent = ch.name;
      document.getElementById('nowPlayingEpg').textContent = (ch.tvgId && state.epgMap[ch.tvgId]) ? state.epgMap[ch.tvgId] : ch.group;
      
      const isMpd = ch.type === 'mpd' || ch.url.toLowerCase().includes('.mpd');
      document.getElementById('loading').classList.remove('hidden');

      if (hasBridge()) {
        window.AndroidBridge.playNativeStream(
          ch.url,
          isMpd ? 'mpd' : 'hls',
          ch.userAgent || state.globalUA,
          ch.referer || ''
        );
      }
    };

    // --- FAST XMLTV EPG PARSER (Capped & Instant) ---
    async function fetchAndParseEpg(epgUrl) {
      if (!epgUrl) return;
      try {
        let xmlText = '';
        if (hasBridge() && typeof window.AndroidBridge.fetchRemoteText === 'function') {
          xmlText = window.AndroidBridge.fetchRemoteText(epgUrl, state.globalUA);
        } else {
          const res = await fetch(epgUrl);
          xmlText = await res.text();
        }
        if (!xmlText) return;

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const programmes = xmlDoc.getElementsByTagName('programme');
        const now = new Date();
        const map = {};
        const limit = Math.min(programmes.length, 4000);

        for (let i = 0; i < limit; i++) {
          const prog = programmes[i];
          const chId = prog.getAttribute('channel');
          const startStr = prog.getAttribute('start');
          const stopStr = prog.getAttribute('stop');
          if (chId && startStr && stopStr && !map[chId]) {
            const start = parseXmltvDate(startStr);
            const stop = parseXmltvDate(stopStr);
            if (now >= start && now <= stop) {
              const titleEl = prog.getElementsByTagName('title')[0];
              if (titleEl) map[chId] = titleEl.textContent;
            }
          }
        }
        state.epgMap = map;
        if (state.current && state.current.tvgId && map[state.current.tvgId]) {
          document.getElementById('nowPlayingEpg').textContent = map[state.current.tvgId];
        }
        applyFilters();
      } catch (e) {
        console.warn('EPG load skipped:', e);
      }
    }

    function parseXmltvDate(str) {
      const y = parseInt(str.substr(0, 4)), m = parseInt(str.substr(4, 2)) - 1, d = parseInt(str.substr(6, 2));
      const h = parseInt(str.substr(8, 2)), min = parseInt(str.substr(10, 2)), s = parseInt(str.substr(12, 2));
      return new Date(y, m, d, h, min, s);
    }

    // --- ROBUST M3U PARSER WITH UA SPOOFING ---
    window.parseM3UAndLoad = (rawText, epgUrl = '') => {
      if (!rawText || !rawText.includes('#EXTINF')) return;
      const lines = rawText.split(/\r?\n/);
      const parsed = [];
      let currentMeta = null;
      let pendingUA = '';
      let pendingReferer = '';

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const commaIdx = line.lastIndexOf(',');
          const name = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Channel';
          const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          const idMatch = line.match(/tvg-id="([^"]+)"/i);
          const uaMatch = line.match(/user-agent="([^"]+)"/i);

          currentMeta = {
            name: name || 'Channel',
            logo: logoMatch ? logoMatch[1] : '',
            group: groupMatch ? groupMatch[1] : 'Live TV',
            tvgId: idMatch ? idMatch[1] : ''
          };
          if (uaMatch) pendingUA = uaMatch[1];
        } else if (line.startsWith('#EXTVLCOPT:http-user-agent=')) {
          pendingUA = line.replace('#EXTVLCOPT:http-user-agent=', '').trim();
        } else if (line.startsWith('#EXTVLCOPT:http-referer=')) {
          pendingReferer = line.replace('#EXTVLCOPT:http-referer=', '').trim();
        } else if (!line.startsWith('#')) {
          let streamUrl = line;
          if (line.includes('|')) {
            const [baseUrl, headerPart] = line.split('|');
            streamUrl = baseUrl.trim();
            const params = new URLSearchParams(headerPart);
            if (params.get('User-Agent')) pendingUA = params.get('User-Agent');
            if (params.get('Referer')) pendingReferer = params.get('Referer');
          }

          parsed.push({
            id: 'm3u-' + parsed.length,
            name: currentMeta ? currentMeta.name : `Channel ${parsed.length + 1}`,
            group: currentMeta ? currentMeta.group : 'Live TV',
            tvgId: currentMeta ? currentMeta.tvgId : '',
            url: streamUrl,
            type: streamUrl.toLowerCase().includes('.mpd') ? 'mpd' : 'hls',
            userAgent: pendingUA || state.globalUA,
            referer: pendingReferer
          });

          currentMeta = null;
          pendingUA = '';
          pendingReferer = '';
        }
      }

      if (parsed.length > 0) {
        state.channels = parsed;
        state.group = 'All';
        applyFilters();
        document.getElementById('modalM3u').classList.add('hidden');
        if (epgUrl) fetchAndParseEpg(epgUrl);
        window.playChannel(state.channels[0]);
      }
    };

    function applyFilters() {
      const q = state.search.toLowerCase();
      state.filtered = state.channels.filter(c => {
        const matchesGroup = state.group === 'All' || c.group === state.group;
        const matchesQuery = !q || c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q);
        return matchesGroup && matchesQuery;
      });

      // Update Group Dropdown
      const gs = document.getElementById('groupSelect');
      const groups = ['All', ...new Set(state.channels.map(c => c.group))];
      gs.innerHTML = '';
      groups.forEach(g => {
        const o = document.createElement('option');
        o.value = g;
        o.textContent = g;
        if (g === state.group) o.selected = true;
        gs.appendChild(o);
      });

      // Update Quick Jump Dropdown
      const qs = document.getElementById('quickChannelSelect');
      qs.innerHTML = '';
      state.filtered.slice(0, 500).forEach((c, i) => {
        const o = document.createElement('option');
        o.value = c.id;
        o.textContent = `${i + 1}. ${c.name}`;
        if (state.current && state.current.id === c.id) o.selected = true;
        qs.appendChild(o);
      });

      renderDeck();
    }

    function renderDeck() {
      const grid = document.getElementById('channelGrid');
      document.getElementById('channelCountBadge').textContent = state.filtered.length;
      grid.innerHTML = '';

      state.filtered.slice(0, 150).forEach(ch => {
        const btn = document.createElement('button');
        const isActive = state.current && state.current.id === ch.id;
        btn.className = `glass rounded-2xl p-2.5 w-44 shrink-0 text-left h-full flex flex-col justify-between transition ${isActive ? 'glass-active border-sky-400' : ''}`;
        const epg = (ch.tvgId && state.epgMap[ch.tvgId]) ? state.epgMap[ch.tvgId] : ch.group;
        btn.innerHTML = `
          <div class="text-xs font-bold text-white truncate">${ch.name}</div>
          <div class="text-[10px] text-sky-300 truncate">${epg}</div>
        `;
        btn.onclick = () => window.playChannel(ch);
        grid.appendChild(btn);
      });
    }

    // --- UI EVENT LISTENERS ---
    document.getElementById('searchInput').oninput = (e) => { state.search = e.target.value; applyFilters(); };
    document.getElementById('groupSelect').onchange = (e) => { state.group = e.target.value; applyFilters(); };
    document.getElementById('quickChannelSelect').onchange = (e) => {
      const c = state.filtered.find(x => x.id === e.target.value);
      if (c) window.playChannel(c);
    };

    document.getElementById('btnOpenModal').onclick = () => document.getElementById('modalM3u').classList.remove('hidden');
    document.getElementById('btnOpenUaModal').onclick = () => {
      document.getElementById('uaPresetSelect').value = state.globalUA;
      document.getElementById('modalUA').classList.remove('hidden');
    };
    document.querySelectorAll('.btnCloseModal').forEach(b => b.onclick = () => {
      document.getElementById('modalM3u').classList.add('hidden');
      document.getElementById('modalUA').classList.add('hidden');
    });

    document.getElementById('btnSaveUaSettings').onclick = () => {
      state.globalUA = document.getElementById('uaPresetSelect').value;
      localStorage.setItem('tvos_ua', state.globalUA);
      document.getElementById('activeUaBadge').textContent = 'UA: ' + (state.globalUA.split(' ')[0] || state.globalUA);
      document.getElementById('modalUA').classList.add('hidden');
      if (state.current) window.playChannel(state.current);
    };

    document.getElementById('btnFetchM3uUrl').onclick = async () => {
      const u = document.getElementById('m3uUrlInput').value.trim();
      const epg = document.getElementById('epgUrlInput').value.trim();
      if (!u) return;
      const txt = hasBridge() ? window.AndroidBridge.fetchRemoteText(u, state.globalUA) : await (await fetch(u)).text();
      window.parseM3UAndLoad(txt, epg);
    };

    document.getElementById('m3uFileInput').onchange = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = (ev) => window.parseM3UAndLoad(ev.target.result, document.getElementById('epgUrlInput').value.trim());
      r.readAsText(f);
    };

    document.getElementById('btnPlayPause').onclick = () => {
      if (hasBridge()) {
        const playing = window.AndroidBridge.togglePlayPause();
        document.getElementById('btnPlayPause').textContent = playing ? 'Pause' : 'Play';
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('activeUaBadge').textContent = 'UA: ' + (state.globalUA.split(' ')[0] || state.globalUA);
      applyFilters();
      window.playChannel(state.channels[0]);
    });
  </script>
</body>
</html>
