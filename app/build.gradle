plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

configurations {
    aautoSdkAar
}

android {
    namespace 'com.my.iptvplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.my.iptvplayer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'

    // Media3 ExoPlayer (DASH, HLS, ClearKey/Widevine DRM & UI)
    def media3_version = "1.3.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"

    // Extract only classes.jar from aauto-sdk AAR to bypass its legacy broken XML resources
    aautoSdkAar 'com.github.martoreto:aauto-sdk:v4.0@aar'
    implementation files({
        def outDir = new File(project.buildDir, "extracted-aauto-sdk")
        outDir.mkdirs()
        def outJar = new File(outDir, "aauto-sdk-classes.jar")
        if (!outJar.exists() || outJar.length() == 0) {
            configurations.aautoSdkAar.resolve().each { aarFile ->
                zipTree(aarFile).matching { include 'classes.jar' }.each { jarFile ->
                    outJar.bytes = jarFile.bytes
                }
            }
        }
        return outJar
    })
}
